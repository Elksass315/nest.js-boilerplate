services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable registry reference}
    ports:
      - ${API_HOST_PORT:-3000}:3000
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    restart: always

  mail-worker:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable registry reference}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    restart: always

  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable registry reference}
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE is required}
    command: ['node_modules/.bin/typeorm', '-d', 'dist/database/data-source.js', 'migration:run']
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-internal
    profiles:
      - deployment

  seed:
    image: ${APP_IMAGE:?APP_IMAGE must be an immutable registry reference}
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE is required}
    command: ['node', 'dist/database/seeds/seed-runner.js', 'run']
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-internal
    profiles:
      - deployment

  postgres:
    restart: always

  redis:
    restart: always
