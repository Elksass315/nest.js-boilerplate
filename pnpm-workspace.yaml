engineStrict: true
autoInstallPeers: false
strictPeerDependencies: true
resolutionMode: highest
savePrefix: ''
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@penta-tech/*'
auditConfig:
  # Accepted 2026-10-05, expires 2026-11-05. braces <=3.0.3 (stack-exhaustion DoS) is reachable only
  # through nestjs-i18n's dev-only chokidar@3 watch path; no patched braces release is published.
  # Remove this entry when braces >=3.0.4 is available and the chokidar chain is upgraded.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
overrides:
  '@grpc/grpc-js@<1.14.5': 1.14.5
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'js-yaml@>=5.0.0 <=5.4.0': 5.4.1
  'multer@<2.4.0': 2.4.0
  'qs@<6.16.0': 6.16.0
verifyDepsBeforeRun: error
strictDepBuilds: true
allowBuilds:
  '@scarf/scarf': false
  argon2: true
  sharp: true
  msgpackr-extract: false
  unrs-resolver: true
  '@swc/core': true
  protobufjs: false
