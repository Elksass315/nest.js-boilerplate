name: Publish immutable image

on:
  push:
    branches: [main, develop, 'release/**']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

      - name: Create semantic release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}"
          ref_tag="${GITHUB_REF_NAME//\//-}"
          tags="${image}:sha-${GITHUB_SHA},${image}:${ref_tag}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            git fetch --force --tags
            version="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)"
            if [[ -n "${version}" ]]; then
              tags="${tags},${image}:${version},${image}:latest"
            fi
          fi
          echo "name=${image}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Jenkins deployment
        if: env.JENKINS_DEPLOY_URL != ''
        env:
          JENKINS_DEPLOY_URL: ${{ secrets.JENKINS_DEPLOY_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            target_environment=development
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            target_environment=staging
          else
            target_environment=production
          fi
          curl --fail --silent --show-error \
            --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            --request POST "${JENKINS_DEPLOY_URL}/buildWithParameters" \
            --data-urlencode "IMAGE_REF=${IMAGE_REF}" \
            --data-urlencode "TARGET_ENV=${target_environment}" \
            --data-urlencode "SOURCE_BRANCH=${GITHUB_REF_NAME}" \
            --data-urlencode "SOURCE_COMMIT=${GITHUB_SHA}"
