name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'release/**', 'hotfix/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_DB: nestjs_saas_test
          POSTGRES_USER: nestjs_saas
          POSTGRES_PASSWORD: integration-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestjs_saas -d nestjs_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
        env:
          REDIS_PASSWORD: integration-redis-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_NAME: NestJS SaaS API
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
      SWAGGER_DOCS_ACCESS: disabled
      SWAGGER_DOCS_USERNAME: ''
      SWAGGER_DOCS_PASSWORD: ''
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: nestjs_saas_test
      DATABASE_USERNAME: nestjs_saas
      DATABASE_PASSWORD: integration-database-password
      DATABASE_SSL_ENABLED: false
      DATABASE_REJECT_UNAUTHORIZED: true
      DATABASE_POOL_SIZE: 5
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      REDIS_DB: 0
      REDIS_CONNECT_TIMEOUT_MS: 5000
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static quality gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm arch:check
          pnpm deps:check
          pnpm deps:duplicates:check

      - name: Run tests and build
        run: |
          pnpm test:cov
          pnpm test:tools
          pnpm migration:show
          pnpm migration:run
          pnpm test:e2e
          pnpm build

      - name: Check licenses and production advisories
        run: |
          pnpm licenses:check
          pnpm audit:prod

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce dependency policy
        run: |
          pnpm deps:check
          pnpm deps:duplicates:check
          pnpm licenses:check
          pnpm audit:prod

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --entrypoint /bin/sh \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo && exec gitleaks git --redact --no-banner --verbose /repo'

  container:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Validate Compose models
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yaml -f compose.dev.yaml config --quiet
          APP_IMAGE=ghcr.io/example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            APP_ENV_FILE=.env \
            docker compose --env-file .env -f compose.yaml -f compose.deploy.yaml config --quiet
      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          push: false
          tags: nestjs-saas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: nestjs-saas:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
