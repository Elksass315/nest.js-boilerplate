name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'release/**', 'hotfix/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
        env:
          POSTGRES_DB: nestjs_saas_test
          POSTGRES_USER: nestjs_saas
          POSTGRES_PASSWORD: integration-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestjs_saas -d nestjs_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
        env:
          REDIS_PASSWORD: integration-redis-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_PORT: 3000
      API_PREFIX: api
      API_VERSION: 1
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
      SWAGGER_ENABLED: false
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: nestjs_saas_test
      DATABASE_USERNAME: nestjs_saas
      DATABASE_PASSWORD: integration-database-password
      DATABASE_SSL_ENABLED: false
      DATABASE_REJECT_UNAUTHORIZED: true
      DATABASE_POOL_SIZE: 5
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      REDIS_DB: 0
      REDIS_CONNECT_TIMEOUT_MS: 5000
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static quality gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm arch:check
          pnpm deps:check
          pnpm deps:duplicates:check

      - name: Run tests and build
        run: |
          pnpm test:cov
          pnpm test:tools
          pnpm migration:show
          pnpm migration:run
          pnpm test:e2e
          pnpm build

      - name: Check licenses and production advisories
        run: |
          pnpm licenses:check
          pnpm audit:prod

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          license-check: true
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BlueOak-1.0.0,
            CC0-1.0, ISC, MIT, MPL-2.0, Python-2.0

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7

  container:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Validate Compose models
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yaml -f compose.dev.yaml config --quiet
          APP_IMAGE=ghcr.io/example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            APP_ENV_FILE=.env \
            docker compose --env-file .env -f compose.yaml -f compose.deploy.yaml config --quiet
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          push: false
          tags: nestjs-saas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: nestjs-saas:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
