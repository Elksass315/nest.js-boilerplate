name: CI

on:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'release/**', 'hotfix/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capability-profiles:
    name: Capability profile ${{ matrix.profile }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile:
          - minimal
          - files
          - 'files,user-avatars'
          - invitations
          - 'files,invitations'
          - 'files,user-avatars,invitations'
          - feature-flags
          - 'files,feature-flags'
          - 'files,user-avatars,feature-flags'
          - 'invitations,feature-flags'
          - 'files,invitations,feature-flags'
          - 'files,user-avatars,invitations,feature-flags'
          - sentry
          - 'files,sentry'
          - 'files,user-avatars,sentry'
          - 'invitations,sentry'
          - 'files,invitations,sentry'
          - 'files,user-avatars,invitations,sentry'
          - 'feature-flags,sentry'
          - 'files,feature-flags,sentry'
          - 'files,user-avatars,feature-flags,sentry'
          - 'invitations,feature-flags,sentry'
          - 'files,invitations,feature-flags,sentry'
          - 'files,user-avatars,invitations,feature-flags,sentry'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm profiles:check --profile="${{ matrix.profile }}"

  quality:
    name: Quality and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: nestjs_saas_test
          POSTGRES_USER: nestjs_saas
          POSTGRES_PASSWORD: integration-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestjs_saas -d nestjs_saas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4.7-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
        env:
          REDIS_PASSWORD: integration-redis-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:4.14.0@sha256:75ba7a4bda54a3020019fba23e99c61bbff7dbf23eea12919e5b75b15c6f03f2
        env:
          SERVICES: s3
          DEBUG: 0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl --fail http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_NAME: NestJS SaaS API
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
      SWAGGER_DOCS_ACCESS: disabled
      SWAGGER_DOCS_USERNAME: ''
      SWAGGER_DOCS_PASSWORD: ''
      AUTH_ACCESS_TOKEN_SECRET: test-only-access-token-secret-at-least-32-characters
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: nestjs_saas_test
      DATABASE_USERNAME: nestjs_saas
      DATABASE_PASSWORD: integration-database-password
      DATABASE_SSL_ENABLED: false
      DATABASE_REJECT_UNAUTHORIZED: true
      DATABASE_POOL_SIZE: 5
      DATABASE_CONNECT_TIMEOUT_MS: 5000
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      REDIS_DB: 0
      REDIS_CONNECT_TIMEOUT_MS: 5000
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 100
      MAIL_ENABLED: true
      MAIL_SMTP_HOST: localhost
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURE: false
      MAIL_ACTION_BASE_URL: http://localhost:3000
      FILES_WRITE_DRIVER: s3
      FILES_READ_DRIVERS: local,s3
      FILES_LOCAL_ROOT: /tmp/nestjs-saas-files
      FILES_S3_BUCKET: app-files
      FILES_S3_REGION: us-east-1
      FILES_S3_ENDPOINT: http://localhost:4566
      FILES_S3_FORCE_PATH_STYLE: true
      FILES_S3_ACCESS_KEY_ID: test
      FILES_S3_SECRET_ACCESS_KEY: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the private S3 test bucket
        run: >-
          node -e "const {S3Client,CreateBucketCommand}=require('@aws-sdk/client-s3');
          const client=new S3Client({region:process.env.FILES_S3_REGION,endpoint:process.env.FILES_S3_ENDPOINT,forcePathStyle:true,credentials:{accessKeyId:'test',secretAccessKey:'test'}});
          client.send(new CreateBucketCommand({Bucket:process.env.FILES_S3_BUCKET})).catch((error)=>{if(error.name!=='BucketAlreadyOwnedByYou'&&error.name!=='BucketAlreadyExists')throw error})"

      - name: Run static quality gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm arch:check
          pnpm i18n:check
          pnpm docs:check
          pnpm runtime-images:check
          pnpm deployment:check
          pnpm deps:check
          pnpm deps:duplicates:check

      - name: Run tests and build
        run: |
          pnpm openapi:generate
          pnpm openapi:check
          pnpm test:cov
          pnpm coverage:changed -- --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          pnpm test:tools
          pnpm migration:show
          pnpm migration:run
          pnpm seed:run
          pnpm test:e2e
          pnpm build

      - name: Check licenses and production advisories
        run: |
          pnpm licenses:check
          pnpm audit:prod

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce dependency policy
        run: |
          pnpm deps:check
          pnpm deps:duplicates:check
          pnpm licenses:check
          pnpm audit:prod

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --entrypoint /bin/sh \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo && exec gitleaks git --gitleaks-ignore-path /repo/.gitleaksignore --redact --no-banner --verbose /repo'

  container:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Validate Compose models
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose.yaml -f compose.dev.yaml config --quiet
          APP_IMAGE=ghcr.io/example/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            APP_ENV_FILE=.env \
            docker compose --env-file .env -f compose.yaml -f compose.deploy.yaml config --quiet
      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          push: false
          tags: nestjs-saas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: nestjs-saas:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan PostgreSQL service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          format: table
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Redis service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: redis:8.4.7-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
          format: table
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
