name: nestjs-saas

services:
  api:
    image: ${APP_IMAGE:-nestjs-saas:local}
    env_file:
      - ${APP_ENV_FILE:-.env}
    init: true
    restart: unless-stopped
    volumes:
      - files_data:/app/storage/files
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('node:http');
          const port=process.env.PORT||'3000';
          const request=http.get(`http://127.0.0.1:$${port}/health/ready`,(response)=>process.exit(response.statusCode===200?0:1));
          request.setTimeout(2500,()=>{request.destroy();process.exit(1)});
          request.on('error',()=>process.exit(1));
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  mail-worker:
    image: ${APP_IMAGE:-nestjs-saas:local}
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: ['node', '--enable-source-maps', 'dist/apps/mail-worker/main.js']
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const fs=require('node:fs');
          const file='/tmp/nestjs-saas-mail-worker.heartbeat';
          process.exit(fs.existsSync(file)&&Date.now()-fs.statSync(file).mtimeMs<45000?0:1);
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  file-worker:
    image: ${APP_IMAGE:-nestjs-saas:local}
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: ['node', '--enable-source-maps', 'dist/apps/file-worker/main.js']
    init: true
    restart: unless-stopped
    volumes:
      - files_data:/app/storage/files
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const fs=require('node:fs');
          const file='/tmp/nestjs-saas-file-worker.heartbeat';
          process.exit(fs.existsSync(file)&&Date.now()-fs.statSync(file).mtimeMs<45000?0:1);
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  outbox-worker:
    image: ${APP_IMAGE:-nestjs-saas:local}
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: ['node', '--enable-source-maps', 'dist/apps/outbox-worker/main.js']
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const fs=require('node:fs');
          const file='/tmp/nestjs-saas-outbox-worker.heartbeat';
          process.exit(fs.existsSync(file)&&Date.now()-fs.statSync(file).mtimeMs<45000?0:1);
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  maintenance-worker:
    image: ${APP_IMAGE:-nestjs-saas:local}
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: ['node', '--enable-source-maps', 'dist/apps/maintenance-worker/main.js']
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const fs=require('node:fs');
          const file='/tmp/nestjs-saas-maintenance-worker.heartbeat';
          process.exit(fs.existsSync(file)&&Date.now()-fs.statSync(file).mtimeMs<45000?0:1);
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

networks:
  backend-internal:
    internal: true
  backend-external:

volumes:
  files_data:
