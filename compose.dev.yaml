services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    command: pnpm start:dev
    ports:
      - ${API_HOST_PORT:-3000}:3000
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development

  postgres:
    ports:
      - ${DATABASE_HOST_PORT:-5432}:5432

  redis:
    ports:
      - ${REDIS_HOST_PORT:-6379}:6379

volumes:
  api_node_modules:
