services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    command: ['node', '--enable-source-maps', 'dist/apps/api/main.js']
    healthcheck:
      start_period: 180s
    ports:
      - ${API_HOST_PORT:-3000}:3000
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mail-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    healthcheck:
      start_period: 180s
    command: ['node', '--enable-source-maps', 'dist/apps/mail-worker/main.js']
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  file-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    healthcheck:
      start_period: 180s
    command: ['node', '--enable-source-maps', 'dist/apps/file-worker/main.js']
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - files_data:/app/storage/files
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    healthcheck:
      start_period: 180s
    command: ['node', '--enable-source-maps', 'dist/apps/outbox-worker/main.js']
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  maintenance-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    healthcheck:
      start_period: 180s
    command: ['node', '--enable-source-maps', 'dist/apps/maintenance-worker/main.js']
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4.14.0@sha256:75ba7a4bda54a3020019fba23e99c61bbff7dbf23eea12919e5b75b15c6f03f2
    environment:
      SERVICES: s3
      DEBUG: 0
      AWS_DEFAULT_REGION: ${FILES_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${FILES_S3_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${FILES_S3_SECRET_ACCESS_KEY:-test}
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-app-files}
    ports:
      - 127.0.0.1:${LOCALSTACK_HOST_PORT:-4566}:4566
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/10-create-bucket.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  mailpit:
    image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  redis:
    image: redis:8.4.6-trixie@sha256:02ec5d8629b6313c9d02739576b6b1f102d152b7231497aff6502da412a93651
    env_file:
      - ${APP_ENV_FILE:-.env}
    command:
      - sh
      - -ec
      - >-
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - 127.0.0.1:${REDIS_HOST_PORT:-6379}:6379
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-internal
      - backend-external

  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 127.0.0.1:${DATABASE_HOST_PORT:-5432}:5432
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

volumes:
  api_node_modules:
  postgres_data:
  redis_data:
