services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    command: pnpm start:dev
    ports:
      - ${API_HOST_PORT:-3000}:3000
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development

  mail-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    command: pnpm start:worker:mail:dev
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    depends_on:
      mailpit:
        condition: service_healthy

  file-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    image: nestjs-saas:development
    command: pnpm start:worker:files:dev
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - files_data:/app/storage/files
    environment:
      NODE_ENV: development

  localstack:
    image: localstack/localstack:2026.7@sha256:f7b778d03717b58c3adce81a740bfafff5c6f9d639159bbf08da557c9ac1b513
    environment:
      SERVICES: s3
      DEBUG: 0
      AWS_DEFAULT_REGION: ${FILES_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${FILES_S3_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${FILES_S3_SECRET_ACCESS_KEY:-test}
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:-app-files}
    ports:
      - 127.0.0.1:${LOCALSTACK_HOST_PORT:-4566}:4566
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/10-create-bucket.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 15
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  mailpit:
    image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    restart: unless-stopped
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal
      - backend-external

  postgres:
    ports:
      - 127.0.0.1:${DATABASE_HOST_PORT:-5432}:5432
    networks:
      - backend-internal
      - backend-external

  redis:
    ports:
      - 127.0.0.1:${REDIS_HOST_PORT:-6379}:6379
    networks:
      - backend-internal
      - backend-external

volumes:
  api_node_modules:
